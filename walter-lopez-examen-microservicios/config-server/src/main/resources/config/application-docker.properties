# ==========================================================================
#  Overrides cuando los servicios corren DENTRO de Docker (perfil docker).
#  El cliente los recibe cuando arranca con SPRING_PROFILES_ACTIVE=docker.
# ==========================================================================

# Dentro de la red de compose, Eureka se llama por su NOMBRE de servicio.
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

# Importante en Docker: cada servicio se registra con su IP (alcanzable en la
# red de compose) en lugar de con el hostname del contenedor.
eureka.instance.prefer-ip-address=true
